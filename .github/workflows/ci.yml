name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/md-mtimes.json is gitignored and required by tsc (src/projectsData.ts)
      - name: Generate md mtime manifest
        run: npm run generate:mtimes

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      # --if-present: server unit tests are only available once the
      # gemini-models feature lands; older branches stay green.
      - name: Server unit tests
        run: npm run test:server --if-present

      - name: Build
        run: npm run build
